services:
  backend:
    build: ./backend
    container_name: selampath-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Named volume keeps SQLite data owned by the non-root container user.
      - selampath-data:/app/data
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - ENV=production
      - ENABLE_DOCS=true
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      - DB_PATH=/app/data/digital_bridge.db
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: nginx:alpine
    container_name: selampath-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  selampath-data:
