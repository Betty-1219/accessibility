version: "3.9"

services:
  backend:
    build: ./backend
    container_name: digital-bridge-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - ENV=production
      - CORS_ORIGINS=*

  frontend:
    image: nginx:alpine
    container_name: digital-bridge-widget
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
