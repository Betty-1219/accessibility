<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="title desc">
  <title id="title">Learner using an accessible laptop</title>
  <desc id="desc">A professional Ethiopian learner with a hearing aid working confidently on a laptop at a desk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y1="0">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#ff8a33"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="380" height="480" rx="28" fill="url(#bg)" stroke="#e5e7eb"/>
  <circle cx="320" cy="90" r="54" fill="#fff3e8"/>
  <circle cx="90" cy="420" r="70" fill="#e8edf5"/>
  <rect x="60" y="350" width="300" height="18" rx="9" fill="#1f2937"/>
  <rect x="95" y="368" width="230" height="10" rx="5" fill="#111827" opacity="0.7"/>
  <!-- laptop -->
  <rect x="135" y="250" width="170" height="105" rx="10" fill="#111827"/>
  <rect x="145" y="260" width="150" height="85" rx="6" fill="#f8fafc"/>
  <rect x="155" y="272" width="80" height="8" rx="4" fill="#d9e2ef"/>
  <rect x="155" y="288" width="110" height="8" rx="4" fill="#e5edf6"/>
  <rect x="155" y="304" width="95" height="8" rx="4" fill="#e5edf6"/>
  <rect x="155" y="320" width="60" height="10" rx="5" fill="url(#accent)"/>
  <rect x="110" y="348" width="220" height="12" rx="6" fill="#374151"/>
  <!-- person (professional, seated) -->
  <ellipse cx="215" cy="220" rx="38" ry="42" fill="#6b3f2a"/>
  <path d="M175 215c5-40 28-60 55-55 22 4 35 24 36 54-12 10-26 15-42 15-20 0-36-5-49-14z" fill="#1f2937"/>
  <path d="M175 225c10 18 25 27 45 27s35-9 45-27v18c0 18-20 32-45 32s-45-14-45-32z" fill="#7a4a33"/>
  <rect x="246" y="212" width="6" height="18" rx="3" fill="#FF6B00"/>
  <circle cx="252" cy="236" r="5" fill="#FF6B00"/>
  <path d="M160 275c10-25 30-40 60-40s50 15 60 40l10 75h-140z" fill="#1f2937"/>
  <path d="M200 238h30v22c0 8-7 14-15 14s-15-6-15-14z" fill="#7a4a33"/>
  <path d="M175 300c15 10 28 15 40 15s25-5 40-15" stroke="#374151" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="150" y="310" width="40" height="14" rx="7" fill="#7a4a33" transform="rotate(-10 150 310)"/>
  <rect x="250" y="305" width="40" height="14" rx="7" fill="#7a4a33" transform="rotate(10 250 305)"/>
  <!-- wheelchair hint, subtle and dignified -->
  <circle cx="150" cy="392" r="34" fill="none" stroke="#4b5563" stroke-width="8"/>
  <circle cx="280" cy="400" r="22" fill="none" stroke="#4b5563" stroke-width="7"/>
  <path d="M150 392h85l20 20" stroke="#4b5563" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M165 320l-20 72" stroke="#4b5563" stroke-width="8" stroke-linecap="round"/>
  <!-- badge -->
  <rect x="58" y="58" width="150" height="34" rx="17" fill="#ffffff" stroke="#e5e7eb"/>
  <circle cx="78" cy="75" r="6" fill="#FF6B00"/>
  <text x="92" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Accessible by design</text>
</svg>
